# Vidura API: the public host each request arrived on.
#
# vidura-api.prabhavalabs.com is a Cloudflare Worker that forwards to
# vidura-api.nipuntheekshana.com. Cloudflare marks those subrequests with
# "CF-Worker: prabhavalabs.com". Passing the original host on (as Host) lets
# sign-in send Google's callback back to the host holding the sign-in cookie;
# the API only accepts hosts listed in API_BASE_URL and API_EXTRA_HOSTS.
#
# Install (http context, as root on the VPS):
#   cp /opt/vidura/server/deploy/nginx/vidura-api-host.conf /etc/nginx/conf.d/vidura-api-host.conf
#   nginx -t && systemctl reload nginx

map $http_cf_worker $vidura_api_host {
    default            $host;
    "prabhavalabs.com" vidura-api.prabhavalabs.com;
}
