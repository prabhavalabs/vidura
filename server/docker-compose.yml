# Vidura self-hosted backend. The database lives on the host's shared Postgres
# (platform-postgres on the external "platform" network, backed up nightly with
# every other app on the box); the API is exposed only on 127.0.0.1:8788 for the
# host nginx to reverse-proxy.
#
# A new database needs db/better-auth.sql then db/schema.sql applied once, as the
# vidura role, before the first start (the bundled Postgres used to run them as
# init scripts on an empty volume).

services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://vidura:${POSTGRES_PASSWORD}@${DB_HOST:-platform-postgres}:5432/vidura
      PORT: "8787"
    networks: [default, platform]
    ports:
      - "127.0.0.1:8788:8787"

  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://vidura:${POSTGRES_PASSWORD}@${DB_HOST:-platform-postgres}:5432/vidura
    networks: [default, platform]
    command: ["bun", "run", "src/worker.ts"]

networks:
  platform:
    name: ${PLATFORM_NETWORK:-platform}
    external: true
