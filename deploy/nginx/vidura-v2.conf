# Vidura v2 on the shared VPS's host nginx: the API, the admin portal and the
# client portal, all served by one container on 127.0.0.1:18795 and told
# apart by Host.
#
# TLS: one Let's Encrypt certificate for the three names (HTTP-01 via webroot),
# so Cloudflare can proxy with SSL mode "Full (strict)".
#
# Install (as root):
#   cp deploy/nginx/vidura-v2.conf /etc/nginx/sites-available/vidura-v2
#   ln -s /etc/nginx/sites-available/vidura-v2 /etc/nginx/sites-enabled/vidura-v2
#   nginx -t && systemctl reload nginx
#
# Everything here is scoped to this site: prefixed names, no default_server.

upstream vidura_v2 {
    server 127.0.0.1:18795;
    keepalive 16;
}

map $http_upgrade $vidura_v2_connection {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    listen [::]:80;
    server_name api-vidura.prabhavalabs.com admin-vidura.prabhavalabs.com vidura.prabhavalabs.com;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/vidura-v2-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api-vidura.prabhavalabs.com admin-vidura.prabhavalabs.com vidura.prabhavalabs.com;
    server_tokens off;

    access_log /var/log/nginx/vidura-v2.access.log;
    error_log  /var/log/nginx/vidura-v2.error.log warn;

    ssl_certificate     /etc/letsencrypt/live/api-vidura.prabhavalabs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-vidura.prabhavalabs.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:vidura_v2_tls:5m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # The client address: CF-Connecting-IP only from Cloudflare's ranges.
    include /etc/nginx/loomcast/cloudflare-ips.conf;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive off;

    # Voice questions upload a recording of up to 5 MB.
    client_max_body_size 6m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    # The app reads the last X-Forwarded-For entry; send only nginx's view.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 5s;
    # Study notes and pictures can take a few minutes to make.
    proxy_read_timeout 300s;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/vidura-v2-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    # The Mac agent's WebSocket. It heartbeats every 15 s.
    location /agent/ {
        proxy_pass http://vidura_v2;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $vidura_v2_connection;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Tutor answers stream as Server-Sent Events: pass every token on as it
    # comes (no buffering, no gzip). The app sends a comment every 15 s, so a
    # quiet stream isn't cut; an answer has 3 minutes at most.
    location ~ ^/api/messages/[^/]+/stream$ {
        proxy_pass http://vidura_v2;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / {
        proxy_pass http://vidura_v2;
    }
}
