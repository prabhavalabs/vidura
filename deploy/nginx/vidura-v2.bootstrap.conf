# Vidura v2, before the TLS certificate exists: answers Let's Encrypt's
# HTTP-01 challenge and nothing else. Replace with vidura-v2.conf once
# certbot has issued the certificate.
server {
    listen 80;
    listen [::]:80;
    server_name api-vidura.prabhavalabs.com admin-vidura.prabhavalabs.com;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/vidura-v2-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 503 "Vidura is being set up.\n";
    }
}
